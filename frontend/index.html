<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Películas - MovieSearch</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- NAVBAR / AUTENTICACIÓN -->
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#" onclick="volverInicio()">🎬 MovieSearch App</a>
            
            <div id="auth-container" class="d-flex align-items-center">
                <!-- Se mostrará el formulario de login/registro o el saludo de usuario según el estado -->
                <div id="logged-out-section" class="d-flex gap-2">
                    <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">Iniciar Sesión</button>
                    <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#registroModal">Registrarse</button>
                </div>
                <div id="logged-in-section" class="d-none text-white d-flex align-items-center gap-3">
                    <span>Hola, <strong id="user-display-name"></strong></span>
                    <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">
        
        <!-- SECCIÓN DE BÚSQUEDA -->
        <div id="search-section" class="row justify-content-center mb-5">
            <div class="col-md-8 text-center">
                <h1 class="mb-3">Encuentra tu película favorita</h1>
                <p class="text-muted">Busca por título o afina tu búsqueda combinando título y año.</p>
                
                <!-- Pestañas o selector de tipo de búsqueda -->
                <ul class="nav nav-pills justify-content-center mb-3" id="searchTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="tab-titulo" data-bs-toggle="pill" data-bs-target="#content-titulo" type="button" role="tab">Solo por Título</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tab-anio" data-bs-toggle="pill" data-bs-target="#content-anio" type="button" role="tab">Título y Año</button>
                    </li>
                </ul>

                <!-- Contenido de las pestañas de búsqueda -->
                <div class="tab-content" id="searchTabsContent">
                    <!-- Búsqueda 1: Solo por Título -->
                    <div class="tab-pane fade show active" id="content-titulo" role="tabpanel">
                        <div class="input-group mb-3">
                            <input type="text" id="input-buscar-titulo" class="form-control" placeholder="Ej. Matrix, Star Wars...">
                            <button class="btn btn-primary" onclick="buscarPeliculasPorTitulo()">Buscar</button>
                        </div>
                    </div>

                    <!-- Búsqueda 2: Título y Año -->
                    <div class="tab-pane fade" id="content-anio" role="tabpanel">
                        <div class="row g-2">
                            <div class="col-md-7">
                                <input type="text" id="input-buscar-titulo-anio" class="form-control" placeholder="Título de la película">
                            </div>
                            <div class="col-md-3">
                                <input type="number" id="input-buscar-anio" class="form-control" placeholder="Año (ej. 1999)">
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-primary w-100" onclick="buscarPeliculasPorTituloYAnio()">Buscar</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- RESULTADOS DE BÚSQUEDA (GRID) -->
        <div id="movies-grid" class="row row-cols-1 row-cols-md-4 g-4 mb-5">
            <!-- Las tarjetas de películas se inyectarán dinámicamente aquí con JavaScript -->
        </div>

        <!-- SECCIÓN DE DETALLE Y COMENTARIOS (Oculta por defecto) -->
        <div id="movie-detail-section" class="d-none">
            <button class="btn btn-secondary mb-3" onclick="volverInicio()">← Volver a la búsqueda</button>
            <div class="card shadow p-4 mb-4">
                <div class="row" id="movie-detail-content">
                    <!-- Detalle de la película -->
                </div>
            </div>

            <!-- BLOQUE DE COMENTARIOS -->
            <div class="card shadow p-4">
                <h3 class="mb-3">Comentarios</h3>
                <div id="comments-list" class="list-group mb-4">
                    <!-- Lista de comentarios -->
                </div>

                <!-- Formulario para comentar (Requiere login) -->
                <div id="comment-form-container">
                    <div class="alert alert-info" id="comment-login-warning">
                        Debes <a href="#" data-bs-toggle="modal" data-bs-target="#loginModal">iniciar sesión</a> para dejar un comentario.
                    </div>
                    <div id="comment-box" class="d-none">
                        <div class="mb-3">
                            <textarea id="texto-comentario" class="form-control" rows="3" placeholder="Escribe tu opinión sobre la película..."></textarea>
                        </div>
                        <button class="btn btn-success" onclick="enviarComentario()">Publicar Comentario</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL DE LOGIN -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Iniciar Sesión</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Usuario (username)</label>
                        <input type="text" id="login-username" class="form-control" placeholder="Tu usuario único">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="login-password" class="form-control" placeholder="Tu contraseña">
                    </div>
                    <button type="button" class="btn btn-primary w-100" onclick="ejecutarLogin()">Entrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE REGISTRO -->
    <div class="modal fade" id="registroModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registro de Nuevo Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Usuario (username único)</label>
                        <input type="text" id="reg-username" class="form-control" placeholder="Ej. pepa123">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre visible (para comentarios)</label>
                        <input type="text" id="reg-nombre" class="form-control" placeholder="Ej. Pepa Pérez">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="Contraseña segura">
                    </div>
                    <button type="button" class="btn btn-warning w-100" onclick="ejecutarRegistro()">Registrarse</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Nuestro script de JavaScript -->
    <script src="/frontend/app.js"></script>
</body>
</html>
